<div class="min-h-screen bg-slate-50 flex items-center justify-center px-6">

  <div class="w-full max-w-md">

    <!-- Logo / Brand -->
    <div class="text-center mb-8">

      <h1 class="text-3xl font-bold text-slate-900 font-[Audiowide]">
        Hire<span class="text-blue-600">Pilot AI</span>
      </h1>

      <!-- <p class="text-slate-500 mt-2">
        Welcome back, future hire 🚀
      </p> -->
      <p class="text-slate-500 mt-2">
        Build confidence. Ace your next interview.
      </p>

    </div>


    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">

      <div class="mb-7">

        <h2 class="text-2xl font-bold text-slate-900">
          Welcome back
        </h2>

        <p class="text-slate-500 mt-1">
          Sign in to continue your interview journey.
        </p>

      </div>


      <!-- Error -->
      @if (errorMessage) {

        <div class="mb-5 rounded-lg bg-red-50 border border-red-200
                    text-red-600 px-4 py-3 text-sm">

          {{ errorMessage }}

        </div>

      }


      <!-- Login Form -->
      <form (ngSubmit)="login()">

        <!-- Email -->
        <div class="mb-5">

          <label
            for="email"
            class="block text-sm font-medium text-slate-700 mb-2">

            Email

          </label>

          <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="you@example.com"
            autocomplete="email"
            class="w-full px-4 py-3 rounded-xl border border-slate-200
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-100
                   outline-none transition"
          />

        </div>


        <!-- Password -->
        <div class="mb-6">

          <div class="flex items-center justify-between mb-2">

            <label
              for="password"
              class="block text-sm font-medium text-slate-700">

              Password

            </label>

            <a
              href="#"
              class="text-sm text-blue-600 hover:text-blue-700">

              Forgot password?

            </a>

          </div>

          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="w-full px-4 py-3 rounded-xl border border-slate-200
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-100
                   outline-none transition"
          />

        </div>


        <!-- Button -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full py-3.5 rounded-xl bg-blue-600 text-white
                 font-semibold hover:bg-blue-700 transition
                 disabled:opacity-60 disabled:cursor-not-allowed">

          @if (loading) {
            Signing in...
          } @else {
            Sign In
          }

        </button>

      </form>


      <!-- Register -->
      <div class="text-center mt-7 text-sm text-slate-500">

        Don't have an account?

        <a
          routerLink="/register"
          class="text-blue-600 font-semibold hover:text-blue-700">

          Create one

        </a>

      </div>

    </div>

  </div>

</div>
